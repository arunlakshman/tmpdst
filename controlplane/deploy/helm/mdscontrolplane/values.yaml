image:
  repository: mdscontrolplane
  tag: dev
  pullPolicy: IfNotPresent

# One replica: the default "mem" store keeps state inside the pod, so a second
# pod would be a separate, empty control plane.
replicaCount: 1

controlPlane:
  # mem, dynamolog or postgres. See `mdscontrolplane -help`.
  store: mem
  logLevel: info
  # Extra command line flags, for example ["-region=us-west-2"].
  extraArgs: []

# The root filesystem is read-only. With -store dynamolog or postgres and no
# -pebble-dir, the binary keeps its Pebble state in a temporary directory under
# /tmp, so /tmp needs a writable volume. The mem store does not write files.
# The state is rebuilt from the log at every start, so an emptyDir is enough.
tmpVolume:
  enabled: true
  sizeLimit: 1Gi

service:
  type: ClusterIP
  grpcPort: 8080
  metricsPort: 9101

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
