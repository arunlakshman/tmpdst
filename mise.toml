# Host tools for `make build` and the pre-commit hook (all modules).
# Bootstrap: install https://mise.jdx.dev then run  mise install
# Java and minio are only for the broker e2e script (make -C broker e2e-kafka-cli).
# make it (in controlplane) and make it-postgres (in broker) need Podman on the host (the docker command is an alias);
# mise cannot install it.

[tools]
go = "1.26.10"
golangci-lint = "2.15.0"
buf = "1.47.2"
java = "corretto-21.0.2.13.1"
minio = "2025.10.15.17.29.55"

[hooks]
postinstall = "make install-hooks"
