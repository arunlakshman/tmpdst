apiVersion: v1
kind: Service
metadata:
  name: {{ include "mdscontrolplane.name" . }}
  labels:
    {{- include "mdscontrolplane.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "mdscontrolplane.labels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
