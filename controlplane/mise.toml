# Host tools for `make build` / the pre-commit hook.
# Bootstrap: install https://mise.jdx.dev then run  mise install
# (installs go, golangci-lint, buf).
# make it needs Docker (Docker Desktop or Engine) on the host; mise cannot install it. The images it runs are pinned in internal/testinfra.

[tools]
go = "1.26.10"
golangci-lint = "2.15.0"
buf = "1.47.2"
