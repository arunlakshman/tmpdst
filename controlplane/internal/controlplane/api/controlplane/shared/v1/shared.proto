syntax = "proto3";

package controlplane.shared.v1;

import "controlplane/options/v1/options.proto";

option go_package = "github.com/manifesterio/mds/controlplane/internal/controlplane/api/controlplane/shared/v1;sharedv1";

// The messages in this file are the ones that the service (controlplane.v1) and
// the log entries (controlplane.log.v1) both use. There is no service here, so
// code that reads log entries does not pull in grpc.

// TopicPartition names one partition of a topic.
message TopicPartition {
  option (controlplane.options.v1.go_struct) = "contract.TopicPartition";
  string topic = 1;
  int32 partition = 2;
}

message SegmentRef {
  option (controlplane.options.v1.go_existing) = "runtime.SegmentRef";
  string key = 1;
  int64 off = 2;
  int64 len = 3;
}

// PendingBatch describes one uploaded batch awaiting offset assignment.
message PendingBatch {
  option (controlplane.options.v1.go_struct) = "contract.PendingBatch";
  TopicPartition tp = 1 [(controlplane.options.v1.go_name) = "TopicPartition"];
  int64 records = 2;
  SegmentRef loc = 3;
}

// BatchRange is one batch of a partition's log: records [Base, Base+Count)
// stored at Loc.
message BatchRange {
  option (controlplane.options.v1.go_struct) = "contract.BatchRange";
  TopicPartition tp = 1 [(controlplane.options.v1.go_name) = "TopicPartition"];
  int64 base = 2 [(controlplane.options.v1.go_type) = "contract.Offset"];
  int64 count = 3;
  SegmentRef loc = 4;
}

// TopicInfo describes one topic.
message TopicInfo {
  option (controlplane.options.v1.go_struct) = "contract.TopicInfo";
  string name = 1;
  int32 partitions = 2;
}

// PartitionOffset is one committed offset of a group. A read of a partition
// that has no commit gives Offset -1 and LeaderEpoch -1.
message PartitionOffset {
  option (controlplane.options.v1.go_struct) = "contract.PartitionOffset";
  TopicPartition tp = 1 [(controlplane.options.v1.go_name) = "TopicPartition"];
  int64 offset = 2;
  int32 leader_epoch = 3;
  string metadata = 4;
}

// GroupSummary is one line of ListGroupsResp.
message GroupSummary {
  option (controlplane.options.v1.go_struct) = "contract.GroupSummary";
  string name = 1;
  string protocol_type = 2;
  string state = 3;
}
