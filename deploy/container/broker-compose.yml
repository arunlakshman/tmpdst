# Real-service test backends (docs/decisions.md row 24). Ports bind to
# loopback only. Start with ops/scripts/it-up.sh.
services:
  # DynamoDB-compatible endpoint over SQLite, in memory: a pristine database
  # per run. Plain HTTP; dev-mode seeds AWS's example credential
  # (AKIAIOSFODNN7EXAMPLE / wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY).
  # The image is distroless; its own HEALTHCHECK is inherited.
  extenddb:
    image: extenddb/extenddb-dev:latest
    environment:
      EXTENDDB__STORAGE__SQLITE__PATH: ":memory:"
    ports:
      - "127.0.0.1:18080:18080"

  # S3 gateway for the object-store adapter (not used by the CP).
  # Endpoint http://127.0.0.1:8333, no auth unless configured.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=64
    ports:
      - "127.0.0.1:8333:8333"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 3s
      timeout: 3s
      retries: 20
