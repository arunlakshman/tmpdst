version: "2"
run:
  timeout: 5m
  tests: true
  issues-exit-code: 1
output:
  formats:
    text:
      path: stdout
      print-issued-lines: false
      print-linter-name: true
      colors: false
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - errorlint
    - gocritic
    - nakedret
    - nolintlint
    - usestdlibvars
    - copyloopvar
    - nonamedreturns
    - forbidigo
    - funlen
    - gocognit
    - nestif
    - errname
    - interfacebloat
    - dupl
    - asciicheck
    - bidichk
    - unused
    - bodyclose
    - noctx
    - gosec
    - modernize
    - perfsprint
  settings:
    gosec:
      excludes:
        - G115
    nonamedreturns:
      report-error-in-defer: false
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^panic$
          msg: "return an error; panic is for impossible state in core/ sim/ only (Effective Go, Panic)"
        - pattern: ^time\.Now$
          msg: "cp/logcp and cp/logsm take an injected clock (Env.Now); do not call time.Now directly"
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 25
    nestif:
      min-complexity: 5
    interfacebloat:
      max: 8
    dupl:
      threshold: 50
    revive:
      rules:
        - name: exported
        - name: var-naming
        - name: package-comments
        - name: error-strings
        - name: error-naming
        - name: indent-error-flow
        - name: superfluous-else
        - name: receiver-naming
        - name: unexported-return
        - name: context-as-argument
        - name: use-any
        - name: early-return
    nolintlint:
      require-specific: true
      require-explanation: true
  exclusions:
    generated: lax
    paths:
      - testdata
      - build
    rules:
      - linters: [forbidigo]
        text: 'panic'
        path: '^(core|sim|tools|veritas)/|_test\.go$'
      - linters: [forbidigo]
        text: 'panic'
        path: '^cp/applier/'
      - linters: [forbidigo]
        text: 'time\.Now'
        path-except: '^cp/(logcp|logsm)/'
      - linters: [forbidigo]
        text: 'time\.Now'
        path: '^cp/(logcp|logsm)/(env\.go|.*_test\.go)$'
      - linters: [funlen, gocognit, nestif, dupl, interfacebloat]
        path: '_test\.go$'
formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - testdata
