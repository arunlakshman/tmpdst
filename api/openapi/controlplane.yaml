openapi: "3.1.0"
info:
  title: "Manifester control plane API"
  version: "1.0.0"
  summary: "JSON over HTTP between brokers and the metadata control plane."
  description: |-
    The control plane is the production twin of `veritas.ControlPlane` (the executable spec); every store (cp/memstore, cp/dynamo) is checked against it op for op. Served by `cp.NewHandler` (cp/handler.go); the broker-side client is cp/cpclient. Wire structs: cp/wire.go. This file is kept in sync with the Go code by api/openapi/spec_test.go; edit controlplane.json and regenerate the YAML (see README.md).

    ## Status mapping

    | Condition | HTTP | Body | Client classification (cpclient.Classifier) |
    |---|---|---|---|
    | success or business error | 200 | JSON, `err` field | business code, NotApplied |
    | malformed JSON, body > 32 MiB | 200 | `{"err":"ErrInvalid"}` | ErrInvalid, NotApplied |
    | ErrUnavailable (throttle, exhausted optimistic retries), context canceled/deadline in the store | 503 | text `unavailable` | ErrUnavailable, NotApplied |
    | log store: a standby answering a write (`commit-segment`, `create-topic`), a node that cannot apply the log, a full commit queue | 503 | text `not active` or `unavailable`, header `Retry-After: 1` on a standby | ErrUnavailable, NotApplied; cpclient moves to the next URL of its list |
    | any other store error | 500 | text `internal error` | ErrIO, MaybeApplied for CommitSegment |
    | other 4xx / 429 from a proxy | 4xx | any | ErrIO NotApplied / 429: ErrUnavailable NotApplied |
    | timeout, reset or EOF after the request was sent | none | none | ErrTimeout or ErrIO, MaybeApplied for mutating ops |

    Lookup and DescribeTopics are reads and always NotApplied. A wrong method on a route is 405 and an unknown path 404 (net/http ServeMux).

    ## Error codes

    Business errors travel in the body's `err` as the frozen `core.ErrCode` spelling. There is no fencing and no producer state (decisions 41, 44): the control plane emits ErrInvalid, ErrConflict and ErrTooLarge only. The numeric slot of the retired ErrFenced is skipped; `ErrFenced` and `ErrOutOfOrder` are not spellings any more.

    ## Idempotency

    CommitSegment is idempotent per `segment_key` (a replay of an identical request returns the original ranges; a different request under the same key is ErrConflict). The control plane assigns the offsets (decision 42): the next offset of a partition is the end of its newest run, and the store appends with a compare-and-set that it retries internally; callers never see the race. CreateTopic, Lookup and DescribeTopics are idempotent. There are no idempotent producers (decision 41), brokers are stateless and there is no registration (decision 44).

    ## Limits (decisions 39, 42)

    DynamoDB commit: at most 100 transaction items = 1 (segment) + distinct partitions + grown topics, else ErrTooLarge. Stored answer blob 300 KB, one run 200 KB, else ErrTooLarge. Broker-side bounds: MaxSegmentPartitions 24, MaxSegmentBatches 256. Request body 32 MiB. Decisions: docs/decisions.md rows 39, 41-44.

    ## Examples

    The worked examples are replayed in order, against a fresh in-memory control plane, by the spec test (`x-replay`).

    ## Log store: roles, 503 and the URL list

    With `manicp -store dynamolog` several nodes serve this API over one shared log. Every response carries `X-CP-Role: active|standby`. A standby answers `lookup` and `describe-topics` (fresh reads, any node) but answers `commit-segment` and `create-topic` with 503, `Retry-After: 1`, before reading the body, so nothing was done and the request is safe to send to the next node. Brokers hold a comma-separated list of node URLs (`manibroker -cp-url a,b`): cpclient uses the URL that last worked and moves on, each URL once per call, on a connect error or a 503; a commit that moves carries the same `segment_key`, so a replay returns the original ranges. `/healthz` is 503 while a node is starting, stopped, or cannot apply the log (unknown entry format); it is 200 on a standby. Rolling back to `-store dynamo` needs commits quiesced and the index flushed (docs/log-cp-service.md).
servers:
  - url: "http://127.0.0.1:8080"
    description: "Loopback in the AWS setup."
tags:
  - name: "control-plane"
    description: "Broker-facing control-plane operations."
paths:
  "/v1/create-topic":
    post:
      operationId: "createTopic"
      summary: "Create or grow a topic"
      description: "Dev/test helper (cpclient.Client.CreateTopic). Creates `topic` with at least `partitions` partitions; it never shrinks a topic, so it is idempotent (max-merge, veritas.ControlPlane.CreateTopic). Empty name or `partitions` <= 0 is ErrInvalid. Topics are also created implicitly by a CommitSegment that names them."
      tags:
        - "control-plane"
      "x-retry":
        idempotent: true
        note: "Safe to retry on any failure."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CreateTopicReq"
            examples:
              create:
                summary: "Create topic orders with 2 partitions"
                value:
                  topic: "orders"
                  partitions: 2
              "invalid-partitions":
                summary: "Zero partitions is ErrInvalid"
                value:
                  topic: "orders"
                  partitions: 0
      responses:
        "200":
          description: "Business outcome. The HTTP status is 200 for success AND for every business error; read `err` in the body (decision 28/34, cp/handler.go). A malformed body, or a body over 32 MiB, is also 200 with `{\"err\":\"ErrInvalid\"}`."
          content:
            "application/json":
              schema:
                anyOf:
                  - $ref: "#/components/schemas/CreateTopicResp"
                  - $ref: "#/components/schemas/ErrorBody"
              examples:
                create:
                  summary: "Create topic orders with 2 partitions"
                  value: {}
                "invalid-partitions":
                  summary: "Zero partitions is ErrInvalid"
                  value:
                    err: "ErrInvalid"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/commit-segment":
    post:
      operationId: "commitSegment"
      summary: "Register an uploaded segment and assign offsets atomically"
      description: |-
        Registers one uploaded object holding batches for many partitions and assigns their offsets in one atomic step: every batch is assigned or none is. `assigned` has one entry per request batch, in request order.

        **Order of checks** (veritas.ControlPlane, the executable spec): (1) `segment_key` already committed: the original ranges again (success), or `ErrConflict` if the request differs; (2) empty key or batches, `records` <= 0, empty topic or negative partition: `ErrInvalid`; (3) otherwise every batch gets `base` = its partition's end (the end of its newest run, 0 for an empty log), in request order, the end growing by `records`: a later batch of the same partition continues after the earlier one. Topics are created implicitly and grow to cover the partition. A failed commit records nothing: its key is reusable.

        **Offsets** (decisions 41, 42): the control plane assigns them; the broker never proposes one. There are no producers, epochs or fencing. A store guards the append with a compare-and-set on the run base and retries internally on a lost race, so concurrent committers (many control-plane replicas, many brokers) get contiguous, non-overlapping offsets per partition.

        **Idempotency / retry**: IDEMPOTENT per `segment_key` (the G# item `attribute_not_exists` in DynamoDB; the stored full answer is replayed verbatim, also on another replica). After MaybeApplied (timeout, reset, 5xx other than 503) the broker retries the same key and batches and gets the original offsets. 503 (`ErrUnavailable`, NotApplied: lost-race retries exhausted after 20 attempts, throttling) is safe to retry.

        **Limits**: a commit costs 1 + (distinct partitions) + (grown topics) DynamoDB transaction items and the transaction allows at most 100; beyond that the answer is `ErrTooLarge` (decision 39). The number of batches does not count toward the transaction. The stored answer blob (`G#`, request + answer) is capped at 300 KB (about 1000 batches) and one partition run at 200 KB; exceeding either is also `ErrTooLarge`. `ErrTooLarge` is NOT retried by the broker, which instead bounds segments up front: `MaxSegmentPartitions` 24, `MaxSegmentBatches` 256 (broker.Config). The in-memory store and the spec have no such limit.

        `seg_key`/`seg_off`/`seg_len` are the byte range (SegmentRef `Loc`) of the batch inside the uploaded object; `seg_len` <= 0 means to the end of the object.
      tags:
        - "control-plane"
      "x-retry":
        idempotent: true
        key: "segment_key"
        maybe_applied_on: "timeout, reset, 5xx other than 503"
        retry_same_request: true
        not_retried:
          - "ErrTooLarge"
          - "ErrInvalid"
          - "ErrConflict"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CommitReq"
            examples:
              "three-batches":
                summary: "3 batches, 2 partitions"
                value:
                  segment_key: "seg-0001"
                  batches:
                    - topic: "orders"
                      partition: 0
                      records: 5
                      seg_key: "seg-0001"
                      seg_off: 0
                      seg_len: 120
                    - topic: "orders"
                      partition: 1
                      records: 3
                      seg_key: "seg-0001"
                      seg_off: 120
                      seg_len: 80
                    - topic: "orders"
                      partition: 0
                      records: 2
                      seg_key: "seg-0001"
                      seg_off: 200
                      seg_len: 60
                description: "Partition 0 gets offsets 0-4 then 5-6 (the third batch continues after the first in request order); partition 1 gets 0-2. Offsets are contiguous per partition and assigned in one atomic step."
              "second-segment":
                summary: "A later segment continues each partition"
                value:
                  segment_key: "seg-0002"
                  batches:
                    - topic: "orders"
                      partition: 1
                      records: 4
                      seg_key: "seg-0002"
                      seg_off: 0
                      seg_len: 90
                    - topic: "orders"
                      partition: 0
                      records: 4
                      seg_key: "seg-0002"
                      seg_off: 90
                      seg_len: 100
                description: "Partition 1 was at 3 and partition 0 at 7 (the end of the newest run): the new batches start there."
              replay:
                summary: "Replay of seg-0001 returns the original offsets"
                value:
                  segment_key: "seg-0001"
                  batches:
                    - topic: "orders"
                      partition: 0
                      records: 5
                      seg_key: "seg-0001"
                      seg_off: 0
                      seg_len: 120
                    - topic: "orders"
                      partition: 1
                      records: 3
                      seg_key: "seg-0001"
                      seg_off: 120
                      seg_len: 80
                    - topic: "orders"
                      partition: 0
                      records: 2
                      seg_key: "seg-0001"
                      seg_off: 200
                      seg_len: 60
                description: "Idempotent per SegmentKey: the same key with the same request returns the original ranges, never new ones, although both partitions have moved on since."
              conflict:
                summary: "Same SegmentKey, different request is ErrConflict"
                value:
                  segment_key: "seg-0001"
                  batches:
                    - topic: "orders"
                      partition: 0
                      records: 5
                      seg_key: "seg-0001"
                      seg_off: 0
                      seg_len: 120
                description: "seg-0001 was committed with three batches; this request has one. Nothing changes."
              empty:
                summary: "No batches is ErrInvalid"
                value:
                  segment_key: "seg-0005"
                  batches: []
      responses:
        "200":
          description: "Business outcome. The HTTP status is 200 for success AND for every business error; read `err` in the body (decision 28/34, cp/handler.go). A malformed body, or a body over 32 MiB, is also 200 with `{\"err\":\"ErrInvalid\"}`."
          content:
            "application/json":
              schema:
                anyOf:
                  - $ref: "#/components/schemas/CommitResp"
                  - $ref: "#/components/schemas/ErrorBody"
              examples:
                "three-batches":
                  summary: "3 batches, 2 partitions"
                  value:
                    assigned:
                      - topic: "orders"
                        partition: 0
                        base: 0
                        count: 5
                        seg_key: "seg-0001"
                        seg_off: 0
                        seg_len: 120
                      - topic: "orders"
                        partition: 1
                        base: 0
                        count: 3
                        seg_key: "seg-0001"
                        seg_off: 120
                        seg_len: 80
                      - topic: "orders"
                        partition: 0
                        base: 5
                        count: 2
                        seg_key: "seg-0001"
                        seg_off: 200
                        seg_len: 60
                  description: "Partition 0 gets offsets 0-4 then 5-6 (the third batch continues after the first in request order); partition 1 gets 0-2. Offsets are contiguous per partition and assigned in one atomic step."
                "second-segment":
                  summary: "A later segment continues each partition"
                  value:
                    assigned:
                      - topic: "orders"
                        partition: 1
                        base: 3
                        count: 4
                        seg_key: "seg-0002"
                        seg_off: 0
                        seg_len: 90
                      - topic: "orders"
                        partition: 0
                        base: 7
                        count: 4
                        seg_key: "seg-0002"
                        seg_off: 90
                        seg_len: 100
                  description: "Partition 1 was at 3 and partition 0 at 7 (the end of the newest run): the new batches start there."
                replay:
                  summary: "Replay of seg-0001 returns the original offsets"
                  value:
                    assigned:
                      - topic: "orders"
                        partition: 0
                        base: 0
                        count: 5
                        seg_key: "seg-0001"
                        seg_off: 0
                        seg_len: 120
                      - topic: "orders"
                        partition: 1
                        base: 0
                        count: 3
                        seg_key: "seg-0001"
                        seg_off: 120
                        seg_len: 80
                      - topic: "orders"
                        partition: 0
                        base: 5
                        count: 2
                        seg_key: "seg-0001"
                        seg_off: 200
                        seg_len: 60
                  description: "Idempotent per SegmentKey: the same key with the same request returns the original ranges, never new ones, although both partitions have moved on since."
                conflict:
                  summary: "Same SegmentKey, different request is ErrConflict"
                  value:
                    err: "ErrConflict"
                  description: "seg-0001 was committed with three batches; this request has one. Nothing changes."
                empty:
                  summary: "No batches is ErrInvalid"
                  value:
                    err: "ErrInvalid"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/lookup":
    post:
      operationId: "lookup"
      summary: "Find the segments holding offsets >= from"
      description: |-
        Read-only. Returns the byte ranges (per assigned batch) holding offsets >= `from` for one partition plus `end`, the partition end offset (the next offset to be assigned, derived from the newest run). `max_bytes` > 0 stops after the batch that takes the summed `seg_len` to `max_bytes` or more, but always returns at least one batch if any matches; `max_bytes` <= 0 is unlimited. An unknown partition is empty with `end` 0. `from` < 0 is ErrInvalid. In DynamoDB, runs (decision 39) are expanded back into the same per-batch ranges.

        Retry semantics: idempotent, always NotApplied; retry freely.
      tags:
        - "control-plane"
      "x-retry":
        idempotent: true
        read_only: true
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/LookupReq"
            examples:
              "all-from-zero":
                summary: "Partition 0 from offset 0"
                value:
                  topic: "orders"
                  partition: 0
                  from: 0
                  max_bytes: 0
                description: "Ranges are assigned batches whose last offset is >= `from`, in offset order. max_bytes 0 means no limit."
              "max-bytes":
                summary: "Partition 1 from offset 4, max_bytes 85"
                value:
                  topic: "orders"
                  partition: 1
                  from: 4
                  max_bytes: 85
                description: "Batches wholly below `from` are dropped (the batch at 0-2). The batch at 3-6 (seg_len 90) takes the byte sum to >= 85, so the answer stops after it although offset 6 is the last."
              "negative-from":
                summary: "Negative from is ErrInvalid"
                value:
                  topic: "orders"
                  partition: 0
                  from: -1
                  max_bytes: 0
      responses:
        "200":
          description: "Business outcome. The HTTP status is 200 for success AND for every business error; read `err` in the body (decision 28/34, cp/handler.go). A malformed body, or a body over 32 MiB, is also 200 with `{\"err\":\"ErrInvalid\"}`."
          content:
            "application/json":
              schema:
                anyOf:
                  - $ref: "#/components/schemas/LookupResp"
                  - $ref: "#/components/schemas/ErrorBody"
              examples:
                "all-from-zero":
                  summary: "Partition 0 from offset 0"
                  value:
                    ranges:
                      - topic: "orders"
                        partition: 0
                        base: 0
                        count: 5
                        seg_key: "seg-0001"
                        seg_off: 0
                        seg_len: 120
                      - topic: "orders"
                        partition: 0
                        base: 5
                        count: 2
                        seg_key: "seg-0001"
                        seg_off: 200
                        seg_len: 60
                      - topic: "orders"
                        partition: 0
                        base: 7
                        count: 4
                        seg_key: "seg-0002"
                        seg_off: 90
                        seg_len: 100
                    end: 11
                  description: "Ranges are assigned batches whose last offset is >= `from`, in offset order. max_bytes 0 means no limit."
                "max-bytes":
                  summary: "Partition 1 from offset 4, max_bytes 85"
                  value:
                    ranges:
                      - topic: "orders"
                        partition: 1
                        base: 3
                        count: 4
                        seg_key: "seg-0002"
                        seg_off: 0
                        seg_len: 90
                    end: 7
                  description: "Batches wholly below `from` are dropped (the batch at 0-2). The batch at 3-6 (seg_len 90) takes the byte sum to >= 85, so the answer stops after it although offset 6 is the last."
                "negative-from":
                  summary: "Negative from is ErrInvalid"
                  value:
                    err: "ErrInvalid"
                    end: 0
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/describe-topics":
    post:
      operationId: "describeTopics"
      summary: "List topics and partition counts (Kafka Metadata)"
      description: "Read-only; answers Kafka Metadata requests. Result is sorted by name. Never returns a business error except ErrInvalid for a malformed body. Retry semantics: idempotent, NotApplied; retry freely."
      tags:
        - "control-plane"
      "x-retry":
        idempotent: true
        read_only: true
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/DescribeReq"
            examples:
              all:
                summary: "All topics"
                value: {}
                description: "An empty or absent `topics` list means all topics."
              filtered:
                summary: "One named topic, one unknown"
                value:
                  topics:
                    - "orders"
                    - "missing"
                description: "Unknown names are omitted, not errors."
      responses:
        "200":
          description: "Business outcome. The HTTP status is 200 for success AND for every business error; read `err` in the body (decision 28/34, cp/handler.go). A malformed body, or a body over 32 MiB, is also 200 with `{\"err\":\"ErrInvalid\"}`."
          content:
            "application/json":
              schema:
                anyOf:
                  - $ref: "#/components/schemas/DescribeResp"
                  - $ref: "#/components/schemas/ErrorBody"
              examples:
                all:
                  summary: "All topics"
                  value:
                    topics:
                      - name: "orders"
                        partitions: 2
                  description: "An empty or absent `topics` list means all topics."
                filtered:
                  summary: "One named topic, one unknown"
                  value:
                    topics:
                      - name: "orders"
                        partitions: 2
                  description: "Unknown names are omitted, not errors."
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/healthz":
    get:
      operationId: "healthz"
      summary: "Liveness probe"
      tags:
        - "control-plane"
      description: "With the memory and transaction stores: always 200 with the plain-text body `ok` while the process serves HTTP; it does not touch the store. With the log store: 200 once the node has restored its checkpoint and caught up and can apply the log (also on a standby), else 503 with the reason as text. The log store sets `X-CP-Role`."
      responses:
        "200":
          description: "Alive."
          content:
            "text/plain":
              schema:
                type: "string"
                const: "ok\n"
              example: "ok\n"
          headers:
            "X-CP-Role":
              description: "Log-backed control plane (manicp -store dynamolog) only: this node's advisory role, \"active\" or \"standby\" (decision 51). Absent on the other stores. Advisory: brokers may log it, nothing depends on it."
              schema:
                type: "string"
                enum:
                  - "active"
                  - "standby"
        "503":
          description: "Log store only: the node is starting, stopped, or blocked on an unknown log entry format."
          content:
            "text/plain":
              schema:
                type: "string"
              example: "logcp: starting\n"
components:
  schemas:
    ErrCode:
      type: "string"
      description: "Wire spelling of core.ErrCode (frozen, never changed). OK is spelled by omitting the field. The numeric slot of the retired ErrFenced (decision 44) has no spelling. The control plane itself emits ErrInvalid (malformed or unparsable input), ErrConflict (SegmentKey replayed with a different request) and ErrTooLarge (commit exceeds the item or blob budget). The remaining spellings (ErrTimeout, ErrUnavailable, ErrNotFound, ErrConnClosed, ErrCorrupt, ErrIO) are valid on the wire for the client (cp.ErrFromWire accepts them) but the server reports those conditions through HTTP status instead. An unknown spelling is a client-side CallError (ErrIO, MaybeApplied for mutating ops)."
      enum:
        - "ErrTimeout"
        - "ErrUnavailable"
        - "ErrNotFound"
        - "ErrConflict"
        - "ErrConnClosed"
        - "ErrTooLarge"
        - "ErrCorrupt"
        - "ErrInvalid"
        - "ErrIO"
    ErrorBody:
      type: "object"
      description: "Reply to a malformed body: only `err`. Always ErrInvalid."
      additionalProperties: false
      required:
        - "err"
      properties:
        err:
          $ref: "#/components/schemas/ErrCode"
    Batch:
      type: "object"
      description: "core.PendingBatch: one partition's batch inside an uploaded segment, with its byte range (Loc). The control plane assigns the offsets (decision 42); the request carries no base."
      required:
        - "topic"
        - "partition"
        - "records"
        - "seg_key"
        - "seg_off"
        - "seg_len"
      properties:
        topic:
          type: "string"
          description: "Topic name. Empty is ErrInvalid."
        partition:
          type: "integer"
          description: "Partition index, >= 0 (negative is ErrInvalid)."
          format: "int32"
          minimum: 0
        records:
          type: "integer"
          description: "Record count in the batch, > 0 (<= 0 is ErrInvalid)."
          format: "int64"
          minimum: 1
        seg_key:
          type: "string"
          description: "Object key of the uploaded segment holding the bytes (Loc.Key). An opaque string to the control plane (format.SegmentKey spells it `seg/<32 hex>`, decision 43)."
        seg_off:
          type: "integer"
          description: "Byte offset of the batch in the object (Loc.Off)."
          format: "int64"
        seg_len:
          type: "integer"
          description: "Byte length (Loc.Len); <= 0 means to the end of the object."
          format: "int64"
    Range:
      type: "object"
      description: "core.BatchRange: where one partition's batch landed: records [base, base+count) stored at the byte range of the segment. Every range is an assigned batch; there are no per-batch errors."
      required:
        - "topic"
        - "partition"
        - "base"
        - "count"
        - "seg_key"
        - "seg_off"
        - "seg_len"
      properties:
        topic:
          type: "string"
          description: "Topic name."
        partition:
          type: "integer"
          description: "Partition index."
          format: "int32"
        base:
          type: "integer"
          description: "First offset of the batch: the partition's end (the end of its newest run) when the commit was applied."
          format: "int64"
          minimum: 0
        count:
          type: "integer"
          description: "Number of records (offsets base..base+count-1)."
          format: "int64"
        seg_key:
          type: "string"
          description: "Object key of the segment (Loc.Key)."
        seg_off:
          type: "integer"
          description: "Byte offset (Loc.Off)."
          format: "int64"
        seg_len:
          type: "integer"
          description: "Byte length (Loc.Len); <= 0 means to the end of the object."
          format: "int64"
    CommitReq:
      type: "object"
      required:
        - "segment_key"
        - "batches"
      properties:
        segment_key:
          type: "string"
          description: "Idempotency key: the object key of the uploaded segment. Must be non-empty."
        batches:
          type: "array"
          minItems: 1
          items:
            $ref: "#/components/schemas/Batch"
          description: "At least 1; the broker caps a segment at MaxSegmentBatches (256) and MaxSegmentPartitions (24); a larger commit may get ErrTooLarge."
    CommitResp:
      type: "object"
      properties:
        err:
          allOf:
            - $ref: "#/components/schemas/ErrCode"
          description: "Whole-call error: ErrInvalid, ErrConflict, ErrTooLarge."
        assigned:
          type: "array"
          items:
            $ref: "#/components/schemas/Range"
          description: "One entry per request batch, in request order. Absent when err is set."
    LookupReq:
      type: "object"
      required:
        - "topic"
        - "partition"
        - "from"
        - "max_bytes"
      properties:
        topic:
          type: "string"
          description: "Topic name."
        partition:
          type: "integer"
          description: "Partition index."
          format: "int32"
        from:
          type: "integer"
          description: "First wanted offset, >= 0 (negative is ErrInvalid)."
          format: "int64"
          minimum: 0
        max_bytes:
          type: "integer"
          description: "Soft cap on the summed seg_len of the returned ranges; <= 0 is unlimited. At least one range is returned if any matches."
          format: "int32"
    LookupResp:
      type: "object"
      required:
        - "end"
      properties:
        err:
          allOf:
            - $ref: "#/components/schemas/ErrCode"
          description: "Business error code; absent means OK."
        ranges:
          type: "array"
          items:
            $ref: "#/components/schemas/Range"
          description: "Assigned batches covering offsets >= from, in offset order. Absent when none."
        end:
          type: "integer"
